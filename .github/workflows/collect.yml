name: Lost Ark Gem Snapshot

on:
  schedule:
    # 중간 6회는 간단 가격 알림 (급락 시 강조)
    - cron: '17 0,3,6,12,15,18 * * *'
      timezone: 'Asia/Seoul'
    # 오전/오후 9:17에는 가격 알림을 포함한 전체 분석 보고서 1회 (중복 전송 방지)
    - cron: '17 9,21 * * *'
      timezone: 'Asia/Seoul'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lostark-gem-snapshot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run offline tests
        run: python -m unittest discover -s tests -v

      - name: Collect gem prices
        env:
          LOSTARK_API_KEY: ${{ secrets.LOSTARK_API_KEY }}
          STOP_AFTER_KST: '2026-11-15'
        run: python collect.py

      - name: Save results to repository
        shell: bash
        run: |
          if [ ! -f data/gems.csv ]; then
            echo 'No data file: collection ended or no new data.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/gems.csv data/latest.md
          if git diff --cached --quiet; then
            echo 'No new data to commit.'
            exit 0
          fi
          git commit -m 'data: update Lost Ark gem snapshots'
          git push

      - name: Send brief price update or full Discord report
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PRICE_DROP_ALERT_PCT: '5'
          DISCORD_REPORT_MODE: ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '17 9,21 * * *') && 'full' || 'price' }}
        run: python discord_notify.py
